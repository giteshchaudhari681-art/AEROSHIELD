services:
  - type: web
    name: aeroshield-api
    env: python
    buildCommand: "cd apps/api && pip install -r requirements.txt"
    startCommand: "cd apps/api && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: POSTGRES_SERVER
        fromDatabase:
          name: aeroshield-db
          property: host
      - key: POSTGRES_USER
        fromDatabase:
          name: aeroshield-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: aeroshield-db
          property: password
      - key: POSTGRES_DB
        fromDatabase:
          name: aeroshield-db
          property: database
      - key: REDIS_URL
        fromService:
          type: redis
          name: aeroshield-redis
          property: connectionString

  - type: redis
    name: aeroshield-redis
    ipAllowList: []

databases:
  - name: aeroshield-db
    databaseName: aeroshield
